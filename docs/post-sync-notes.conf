# Post-sync notes: `glob-pattern|message`, one per line.
# When sync.sh applies framework updates, any CHANGED path matching a
# pattern prints its message under "Post-sync steps required". Use this to
# tell operators (and their agents) about one-time migration steps.

_tools/aikb-search/*|Search stack updated: existing indexes gain new tables automatically, but content entities need a one-time full reindex — run: python3 _tools/aikb-search/indexer.py --force  (use _tools/aikb-search/.venv/bin/python if setup.sh created a venv)
